[package]
name = "six"
version = "0.1.0"
edition = "2024"

[dependencies]
num-bigint = "0.4.6"
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ureq = { version = "2.10", features = ["json"] }
base64 = "0.22"

[[bin]]
name = "six"
path = "src/main.rs"

[[bin]]
name = "sixi"
path = "src/sixi.rs"

[build-dependencies]
cc = "1.2.62"
